name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI only reads code. It has no cloud credentials and cannot deploy.
permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  application:
    name: Node.js app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: node --check server.js
      - name: Dependency audit (reports; does not block)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  terraform:
    name: Terraform validate + IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: Format
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Init (no backend, no cloud calls)
        run: terraform -chdir=terraform init -backend=false
      - name: Validate
        run: terraform -chdir=terraform validate
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
      - name: Trivy IaC scan (reports; does not block)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: "0"

  container:
    name: Docker build + image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag file-vault:ci .
      - name: Trivy image scan (reports; does not block)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: file-vault:ci
          severity: HIGH,CRITICAL
          exit-code: "0"
