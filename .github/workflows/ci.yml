name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI only reads code. It has no cloud credentials and cannot deploy.
permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks is installed by script rather than run through its action.
      # The action derives a commit range from the push event and scans only
      # that range, so it scans nothing (and fails) whenever the range cannot
      # be resolved, and it never re-examines older commits. Scanning the whole
      # history on every run is deterministic and strictly more thorough.
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
        env:
          GITLEAKS_VERSION: 8.24.3
      - name: Scan full history
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  application:
    name: Node.js app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: node --check server.js
      - name: Dependency audit (reports; does not block)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  terraform:
    name: Terraform validate + IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: Format
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Init (no backend, no cloud calls)
        run: terraform -chdir=terraform init -backend=false
      - name: Validate
        run: terraform -chdir=terraform validate
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Trivy IaC scan (reports; does not block)
        run: trivy config terraform --severity HIGH,CRITICAL --exit-code 0

  container:
    name: Docker build + image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag file-vault:ci .
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Trivy image scan (reports; does not block)
        run: trivy image file-vault:ci --severity HIGH,CRITICAL --exit-code 0
